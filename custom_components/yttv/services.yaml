cast:
  name: Cast channel
  description: Cast a channel by name to a yttv media_player device.
  fields:
    device:
      name: Device
      description: Target yttv media_player entity.
      required: true
      example: media_player.living_room_tv
      selector:
        entity:
          integration: yttv
          domain: media_player
    channel:
      name: Channel
      description: Channel name (substring match against the bridge's channel cache).
      example: ESPN
      selector:
        text:
    video_id:
      name: Video ID
      description: The channel's live video id from the guide.
      example: PFuNFGzJDE4
      selector:
        text:

guide:
  name: Channel guide
  description: List channels with what is airing now, a page at a time, and the TVs the bridge knows.
  fields:
    start:
      name: Start
      description: Position to continue from, as returned in the previous page's next.
      example: 0
      selector:
        number:
          min: 0
          mode: box

stop:
  name: Stop playback
  description: Stop playback on a yttv media_player device.
  fields:
    device:
      name: Device
      description: Target yttv media_player entity.
      required: true
      example: media_player.living_room_tv
      selector:
        entity:
          integration: yttv
          domain: media_player
